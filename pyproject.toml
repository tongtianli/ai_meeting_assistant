[project]
name = "ai-meeting-assistant"
version = "0.1.0"
description = "AI Meeting Assistant — meeting audio to structured minutes (PRD v2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
funasr = [
    "funasr>=1.2",
    "torch>=2.0",
    "torchaudio>=2.0",
    "modelscope>=1.20",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
